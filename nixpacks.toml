# Nixpacks build plan dành cho Dokploy Application.
# Docker Compose/Dockerfile vẫn là phương án triển khai độc lập và không bị thay đổi bởi file này.

[variables]
NODE_ENV = "production"
DATA_DRIVER = "appwrite"
HOSTNAME = "0.0.0.0"
PORT = "3000"
NEXT_TELEMETRY_DISABLED = "1"

[phases.install]
cmds = ["npm ci --ignore-scripts --no-audit --no-fund"]

[phases.build]
# Chỉ dùng placeholder trong đúng tiến trình build để startup validation của Next.js có thể chạy.
# Secret thật không được ghi vào image; Dokploy inject chúng khi container khởi động.
cmds = ["NODE_OPTIONS=--max-old-space-size=768 DATA_DRIVER=appwrite APPWRITE_ENDPOINT=https://build.invalid/v1 APPWRITE_PROJECT_ID=build APPWRITE_SERVER_API_KEY=build SESSION_SECRET=build-time-placeholder-not-used-at-runtime npm run build:nixpacks"]

[start]
cmd = "npm run start:nixpacks"
